
      - name: Extract Expo project
        run: |
          echo "Checking repository files..."
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"

          mkdir -p app
          unzip -o "$ZIP_FILE" -d app

          if [ ! -f app/package.json ]; then
            echo "ERROR: package.json not found"
            find app -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f app/app.json ]; then
            echo "ERROR: app.json not found"
            find app -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f app/eas.json ]; then
            echo "ERROR: eas.json not found"
            find app -maxdepth 4 -type f
            exit 1
          fi
